<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企划详情 | 成桂零对接服务站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230066cc'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%23fff' font-family='serif'%3E成%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="elements/style.css">
<style>
  .pdfwrap{background:var(--gray-bg,#f5f5f7);border:1px solid var(--line,#e8e8ed);border-radius:18px;padding:14px;margin:0 0 26px}
  .pdfwrap .pdfhead{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin:0 4px 10px;color:var(--ink,#1d1d1f)}
  .pdfwrap iframe{width:100%;height:560px;border:none;border-radius:12px;background:#fff}
  .pdfplaceholder{border:2px dashed var(--line,#c7c7cc);border-radius:12px;padding:40px 20px;text-align:center;color:var(--sub,#6e6e73)}
  .pdfplaceholder .btn{margin-top:12px}
  .backrow{margin:0 0 18px}
  .backrow a{color:var(--link,#0066cc);text-decoration:none;font-weight:500}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="seal">成</span>
      <span>
        <span class="bt">成桂零对接服务站</span>
        <span class="bs">男装 · 童装 · 大码男装 · 家居服</span>
      </span>
    </a>
    <nav class="topnav">
      <a href="index.html">← 返回首页</a>
      <a href="plan-demand.html">企划需求</a>
    </nav>
    <span class="today js-date"></span>
  </div>
</header>

<section class="hero" style="padding:30px 0 24px">
  <div class="wrap">
    <div class="backrow"><a href="plan-demand.html">← 返回企划需求列表</a></div>
    <span class="tagline js-cat">企划详情</span>
    <h1 class="js-title" style="font-size:clamp(26px,4vw,40px)">企划款式</h1>
    <p class="js-desc sub"></p>
  </div>
</section>

<main class="wrap" id="planDetailRoot">
  <span class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 加载中...</span>
</main>

<footer class="footer">
  <div class="wrap">
    <div><b>成桂零对接服务站</b><br>企划详情 · 男装 / 童装 / 大码男装 / 家居服</div>
    <div class="dis"><b>数据维护</b><br>企划数据见 elements/data-plan-demand.js，企划PDF放入 assets/pdf/ 后填写 pdf 字段。</div>
    <div><span style="cursor:pointer" class="backtop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 返回顶部</span></div>
  </div>
</footer>

<script src="elements/data-plan-demand.js"></script>
<script src="elements/common.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function qs(){var m=location.search.match(/[?&]id=(\d+)/);return m?parseInt(m[1],10):0;}
  var idx=qs();
  var DATA=window.CGL_PLAN_DEMAND||[];
  var grp=DATA[idx];

  function init(){
    var root=$('planDetailRoot');
    if(!grp){
      root.innerHTML='<p class="ph">未找到该企划（id='+idx+'）。请从企划需求列表进入。</p>';
      return;
    }
    var cat=$('cat'); if(cat) cat.textContent='📚 '+(grp.cat||'企划');
    var t=$('title'); if(t) t.textContent=grp.group;
    var d=$('desc'); if(d) d.textContent=grp.desc||'';
    var items=grp.items||[];
    var pdfName=grp.pdf||('plan-'+(idx+1)+'.pdf');
    var pdfHref='assets/pdf/'+pdfName;

    var h='';
    // PDF 区
    h+='<div class="pdfwrap reveal"><div class="pdfhead">📄 企划材料（'+CGL.esc(pdfName)+'）</div>';
    h+='<div class="pdfslot" id="pdfSlot"><div class="pdfplaceholder">'+ 
       '<div>企划PDF材料尚未上传，请联系负责人上传后自动显示预览。</div>'+
       '<button class="btn" data-open="'+CGL.esc(pdfHref)+'">在浏览器中打开该PDF</button></div></div></div>';
    // 版权提示
    h+='<div class="banner warn" style="max-width:820px;margin:0 0 26px"><div><b>⚠️ 版权提示</b>企划款式图仅作方向参考，请勿直接复制；提报商品需具备合法来源与授权。有类似款请复制「款式编号」同步成桂零。</div></div>';
    // 款式网格
    if(items.length){
      h+='<h2 style="margin:6px 0 16px;font-size:22px">款式参考（'+items.length+'）</h2><div class="grid g4">';
      for(var i=0;i<items.length;i++){
        var it=items[i];
        h+='<div class="imgcard" data-idx="'+i+'"><div class="ph"><img src="'+CGL.esc(it.img)+'" alt="'+CGL.esc(it.title)+'" loading="lazy"></div>'+
           '<div class="pbody"><div class="pno">'+CGL.esc(it.no)+'</div><div style="font-size:13px">'+CGL.esc(it.title)+'</div></div></div>';
      }
      h+='</div>';
    }else{
      h+='<p class="ph">该企划暂未录入款式。</p>';
    }
    root.innerHTML=h;

    // PDF 存在性探测（客户端尽力而为：加载失败则保留占位）
    var slot=$('pdfSlot');
    var ifr=document.createElement('iframe');
    ifr.title=pdfName;
    var loaded=false;
    ifr.onload=function(){ loaded=true; slot.innerHTML=''; slot.appendChild(ifr); };
    ifr.onerror=function(){ /* 保持占位 */ };
    ifr.src=pdfHref;
    setTimeout(function(){ if(!loaded){ /* 文件不可加载，保留占位；放置打开按钮事件 */ } },1500);

    // 打开按钮
    var openBtns=root.querySelectorAll('[data-open]');
    for(var j=0;j<openBtns.length;j++){ (function(btn){ btn.addEventListener('click',function(){ window.open(btn.getAttribute('data-open'),'_blank'); }); })(openBtns[j]); }

    // 款式点击放大
    var cards=root.querySelectorAll('.imgcard');
    for(var k=0;k<cards.length;k++){ (function(card){ card.addEventListener('click',function(){
      var o=items[parseInt(card.getAttribute('data-idx'),10)];
      if(!o) return;
      CGL.viewImage({img:o.img,title:o.title,extra:[['款式编号',o.no],['企划',grp.group],['类目',grp.cat||'-']],
        acts:[{label:'复制款式编号',cls:'accent',fn:function(){CGL.copyText(o.no);}}]});
    }); })(cards[k]); }
  }

  document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
